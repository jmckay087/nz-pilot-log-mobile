<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<title>Updating NZ Pilot Log</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:#18212b;background:#f4f7fa}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:420px;background:#fff;border:1px solid #e6edf2;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(11,31,51,.1);text-align:center}.plane{font-size:38px}.title{font-size:23px;font-weight:800;margin:12px 0 8px}.muted{color:#667788;line-height:1.5}.status{margin-top:18px;padding:12px;border-radius:12px;background:#edf6ff;color:#1d4e7a;font-weight:700}
</style>
</head>
<body>
<div class="card"><div class="plane">✈︎</div><div class="title">Updating NZ Pilot Log</div><div class="muted">Clearing only old app files and the old offline cache. Your saved flights and settings are not being deleted.</div><div class="status" id="status">Preparing update…</div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
   status.textContent='Removing old offline cache…';
   if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
   if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('nz-pilot-log-mobile')).map(k=>caches.delete(k)));}
   status.textContent='Loading NZ Pilot Log v1.0.4…';
   setTimeout(()=>location.replace('./?fresh=1.0.4&t='+Date.now()),500);
 }catch(err){status.textContent='Update reset finished. Tap Back, then reopen NZ Pilot Log.';console.error(err);}
})();
</script>
</body>
</html>
